[package]
name = "archmaker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
archmaker-core = { path = "../crates/archmaker-core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
