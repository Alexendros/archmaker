[package]
name = "archmaker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
archmaker-core = { path = "../crates/archmaker-core" }
archmaker-hardware = { path = "../crates/archmaker-hardware" }
archmaker-domain = { path = "../crates/archmaker-domain" }

[features]
default = ["custom-protocol", "hardware-probe"]
custom-protocol = ["tauri/custom-protocol"]
hardware-probe = ["archmaker-hardware/probe"]
