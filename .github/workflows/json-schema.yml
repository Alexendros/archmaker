# json-schema — Meta-validación de contratos JSON Schema (Draft 2020-12) y corpus.
#
# Gate cubierto:
#   G4  Datos    -> meta-validación de schemas + corpus válido/inválido
#   G5  Interfaces -> base de contratos CorePort/protocol (cuando existan)
#
# Fuente: contracts/json-schema/README.md, ADR-0005, docs/09-quality/ci-cd.md
# Estado: draft. DEC-002 aceptada y modelo de dominio fijado: los 8 schemas y su
# corpus válido/inválido existen. Acciones fijadas por SHA y dependencias pip
# fijadas. Dos jobs: meta-validación de schemas y validación del corpus.

name: json-schema

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: json-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta-validate:
    name: Meta-validación JSON Schema (G4/G5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Meta-validar schemas
        run: |
          # jsonschema fijado (supply-chain).
          python3 -m pip install --no-input --disable-pip-version-check "jsonschema==4.23.0"
          python3 - <<'PY'
          import glob
          import json
          import os
          import sys

          from jsonschema import Draft202012Validator

          base = "contracts/json-schema"
          schemas = sorted(glob.glob(os.path.join(base, "**", "*.schema.json"), recursive=True))

          if not schemas:
              print(f"PENDIENTE: no hay schemas en {base}/. Nada que meta-validar (guard).")
              sys.exit(0)

          bad = 0
          for f in schemas:
              try:
                  schema = json.load(open(f, encoding="utf-8"))
                  Draft202012Validator.check_schema(schema)
                  print(f"OK {f}")
              except Exception as e:
                  bad += 1
                  print(f"FAIL {f}: {e}")

          if bad:
              print(f"{bad} schemas inválidos contra el meta-schema Draft 2020-12")
              sys.exit(1)
          print(f"{len(schemas)} schemas meta-válidos (Draft 2020-12)")
          PY

  corpus-validate:
    name: Corpus válido/inválido (G4/G5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Validar corpus contra schemas
        run: |
          # jsonschema fijado (supply-chain).
          python3 -m pip install --no-input --disable-pip-version-check "jsonschema==4.23.0"
          python3 - <<'PY'
          import glob
          import json
          import os
          import sys

          from jsonschema import Draft202012Validator

          base = "contracts/json-schema"
          examples = os.path.join(base, "examples")

          # Mapeo nombre -> schema (los 8 contratos P0).
          names = [
              "draft",
              "catalog",
              "rule",
              "diagnostic",
              "manifest",
              "artifact",
              "installation-plan",
              "runner-envelope",
          ]

          def load_schema(name):
              path = os.path.join(base, f"{name}.schema.json")
              if not os.path.exists(path):
                  print(f"FALTA schema {path}")
                  sys.exit(1)
              return Draft202012Validator(json.load(open(path, encoding="utf-8")))

          # Guard: si aún no hay corpus, no fallar.
          valid_files = sorted(glob.glob(os.path.join(examples, "*.valid.json")))
          invalid_files = sorted(glob.glob(os.path.join(examples, "*.invalid.json")))
          if not valid_files and not invalid_files:
              print(f"PENDIENTE: no hay corpus en {examples}/ (guard).")
              sys.exit(0)

          def example_name(path, suffix):
              stem = os.path.basename(path)[: -len(suffix)]
              if "-" in stem:
                  stem = stem.split("-", 1)[1]
              return stem

          errors = 0

          for f in valid_files:
              name = example_name(f, ".valid.json")
              validator = load_schema(name)
              instance = json.load(open(f, encoding="utf-8"))
              errs = sorted(validator.iter_errors(instance), key=lambda e: e.path)
              if errs:
                  errors += 1
                  print(f"FAIL {f} debería ser válido contra {name}.schema.json")
                  for e in errs[:3]:
                      print(f"    - {list(e.path)}: {e.message}")
              else:
                  print(f"OK   {f} válido contra {name}.schema.json")

          for f in invalid_files:
              name = example_name(f, ".invalid.json")
              validator = load_schema(name)
              instance = json.load(open(f, encoding="utf-8"))
              errs = list(validator.iter_errors(instance))
              if errs:
                  print(f"OK   {f} rechazado por {name}.schema.json")
              else:
                  errors += 1
                  print(f"FAIL {f} debería ser inválido pero {name}.schema.json lo aceptó")

          if errors:
              print(f"{errors} discrepancias en el corpus")
              sys.exit(1)
          print(f"Corpus OK: {len(valid_files)} válidos + {len(invalid_files)} inválidos")
          PY
