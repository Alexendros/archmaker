# json-schema — Meta-validación de contratos JSON Schema (Draft 2020-12).
#
# Gate cubierto:
#   G4  Datos    -> meta-validación de schemas
#   G5  Interfaces -> base de contratos CorePort/protocol (cuando existan)
#
# Fuente: contracts/json-schema/README.md, ADR-0005, docs/09-quality/ci-cd.md
# Estado: draft. DEC-002 aceptada y modelo de dominio fijado: los 8 schemas ya
# existen (guard cubre el caso vacío). Acciones fijadas por SHA y dependencias pip
# fijadas. PENDIENTE: job dedicado que valide el corpus válido/inválido de
# contracts/json-schema/examples/.

name: json-schema

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: json-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta-validate:
    name: Meta-validación JSON Schema (G4/G5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Meta-validar schemas
        run: |
          # jsonschema fijado (supply-chain).
          python3 -m pip install --no-input --disable-pip-version-check "jsonschema==4.23.0"
          python3 - <<'PY'
          import glob
          import json
          import os
          import sys

          from jsonschema import Draft202012Validator

          base = "contracts/json-schema"
          schemas = []
          for f in glob.glob(os.path.join(base, "**", "*.json"), recursive=True):
              parts = f.split(os.sep)
              if "fixtures" in parts:
                  continue
              schemas.append(f)

          if not schemas:
              print(f"PENDIENTE: no hay schemas en {base}/. Nada que meta-validar (guard).")
              print("Crear tras aceptar DEC-002 y el modelo de dominio.")
              sys.exit(0)

          bad = 0
          for f in sorted(schemas):
              try:
                  schema = json.load(open(f, encoding="utf-8"))
                  Draft202012Validator.check_schema(schema)
                  print(f"OK {f}")
              except Exception as e:
                  bad += 1
                  print(f"FAIL {f}: {e}")

          if bad:
              print(f"{bad} schemas inválidos contra el meta-schema Draft 2020-12")
              sys.exit(1)
          print(f"{len(schemas)} schemas meta-válidos (Draft 2020-12)")
          PY
