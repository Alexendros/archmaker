# canonicalization — Vectores golden del perfil archmaker-canonicalization-profile@v1.
#
# Gate cubierto:
#   G4  Datos -> corpus de canonicalización y paridad de implementaciones (R5, AUD-009/AUD-010)
#
# Fuente: docs/03-data/canonicalization-profile-v1.md, ADR-0007, contracts/test-vectors/canonicalization/
# Estado: draft. El verificador solo usa la biblioteca estándar de Python; la paridad cruzada
# usa el Node.js preinstalado en ubuntu-latest (sin acción externa que fijar por SHA).

name: canonicalization

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonicalization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-vectors:
    name: Vectores golden y paridad (G4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Verificar bytes canónicos, digest y paridad
        run: python3 tools/canonicalize.py
