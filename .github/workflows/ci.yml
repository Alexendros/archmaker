# ci — CI completa MVP-0 (fase I10, T-I10-01).
#
# Gates cubiertos:
#   G9  Calidad  -> lint/format/check/test/audit de Rust + TS + docs + schemas
#   G4  Datos    -> schemas, corpus, canonicalización (vía validadores Python)
#   G5  Interfaces -> front matter, trazabilidad, gates, refs de schema
#
# Entradas: docs/09-quality/ci-cd.md, docs/09-quality/test-matrix.md,
#           ADR-0005, ADR-0006, ADR-0008, DEC-006.
# No duplica la intención de docs-validate/json-schema/canonicalization;
# los agrega como superficie única de calidad (el plan I10 exige estos
# comandos en ci.yml aunque ya existan en workflows temáticos).
#
# Política supply-chain (docs/09-quality/ci-cd.md):
#   - Acciones fijadas por SHA ya verificado en docs-validate.yml.
#   - permissions: contents: read por defecto; sin id-token aquí.
#   - concurrency + timeout-minutes en cada job.
#
# Nota: `cargo clippy`/`cargo test` llevan --workspace porque el
# Cargo.toml raíz es un workspace virtual (sin [package]); el comando
# desnudo del enunciado fallaría con "no packages". fmt --check es
# workspace-wide por defecto. `pnpm check` y `cargo/npm audit` son
# skip-if-missing documentados (ver test-matrix.md, gaps I10-GAP-*).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust fmt/clippy/test (G9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain pinned (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  frontend:
    name: Frontend pnpm check si existe (G9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detectar script "check" en package.json
        id: detect
        run: |
          if node -e "const s=require('./package.json').scripts||{};process.exit(s.check?0:1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: pnpm check
        # skip-if-missing: hoy package.json no define "check" (gap I10-GAP-02).
        if: steps.detect.outputs.present == 'true'
        run: |
          corepack enable || true
          pnpm check
      - name: Aviso skip-if-missing
        if: steps.detect.outputs.present != 'true'
        run: echo 'SKIP sin script check (gap I10-GAP-02).'

  docs-python:
    name: Validadores Python + canonicalización (G0/G4/G5/G7/G9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: front matter + trazabilidad (no-strict) + gates + refs + canonicalize
        run: |
          # Dependencias fijadas (supply-chain, mismos pins que docs-validate.yml).
          python3 -m pip install --no-input --disable-pip-version-check pyyaml==6.0.2 "jsonschema==4.23.0"
          python3 tools/validate_front_matter.py
          python3 tools/validate_traceability.py
          python3 tools/gates.py
          python3 tools/validate_schema_refs.py
          python3 tools/canonicalize.py

  markdownlint:
    name: Markdown lint (G9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: markdownlint-cli2
        # Acción fijada por SHA ya verificado (mismo pin que docs-validate.yml).
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: |
            docs/**/*.md
            *.md
        # Config del gate: .markdownlint-cli2.jsonc (auto-descubierta).

  audit:
    name: Security audit Rust/JS (G9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: cargo-audit si disponible
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            echo "cargo-audit ausente; instalando versión latest con --locked (crates.io)..."
            cargo install cargo-audit --locked
          fi
          cargo audit
      - name: pnpm/npm audit si hay lockfile
        # skip-if-missing: hoy no existe pnpm-lock.yaml (gap I10-GAP-03);
        # npm audit exige lockfile y falla sin él, por eso se condiciona.
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable || true
            pnpm audit --audit-level high
          else
            echo "SKIP: sin pnpm-lock.yaml no hay auditoría JS ejecutable (gap I10-GAP-03)."
          fi
