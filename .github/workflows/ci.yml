# ci — CI completa MVP-0 (fase I10, T-I10-01).
#
# Gates cubiertos:
#   G9  Calidad  -> lint/format/check/test/audit de Rust + TS + docs + schemas
#   G4  Datos    -> schemas, corpus, canonicalización (vía validadores Python)
#   G5  Interfaces -> front matter, trazabilidad, gates, refs de schema
#   G6  UX       -> accesibilidad automatizada + regresión visual
#
# Entradas: docs/09-quality/ci-cd.md, docs/09-quality/test-matrix.md,
#           ADR-0005, ADR-0006, ADR-0008, DEC-006.
# No duplica la intención de docs-validate/json-schema/canonicalization;
# los agrega como superficie única de calidad (el plan I10 exige estos
# comandos en ci.yml aunque ya existan en workflows temáticos).
#
# Política supply-chain (docs/09-quality/ci-cd.md):
#   - Acciones fijadas por SHA ya verificado en docs-validate.yml.
#   - permissions: contents: read por defecto; sin id-token aquí.
#   - concurrency + timeout-minutes en cada job.
#
# Nota: `cargo clippy`/`cargo test` llevan --workspace porque el
# Cargo.toml raíz es un workspace virtual (sin [package]); el comando
# desnudo del enunciado fallaría con "no packages". fmt --check es
# workspace-wide por defecto.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust fmt/clippy/test (G9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain pinned (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Instalar deps sistema Tauri/GTK (glib/gdk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      # tauri::generate_context! exige que exista frontendDist (apps/web/dist);
      # en CI no hay build web previo — stub mínimo para compilar el crate.
      - name: Stub frontendDist para generate_context
        run: |
          # Mismo mount point que apps/web/index.html (id="root") para que
          # frontend_dist_is_real_web_build_not_mock no falle ante el stub de CI.
          mkdir -p apps/web/dist
          printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Forge — Configurador</title></head><body><div id="root"></div></body></html>' \
            > apps/web/dist/index.html
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace --locked
      - name: Validar schemas Tauri (SRC-004)
        run: |
          python3 -m pip install --no-input --disable-pip-version-check "jsonschema==4.23.0"
          python3 tools/validate_tauri_schemas.py

  security-runtime:
    name: Security runtime deny (G8/G9 / NFR-SEC-001)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain pinned (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Instalar deps sistema Tauri/GTK (glib/gdk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Stub frontendDist para generate_context
        run: |
          mkdir -p apps/web/dist
          printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Forge — Configurador</title></head><body><div id="root"></div></body></html>' \
            > apps/web/dist/index.html
      # Nombre de test obligatorio: si falta, cargo test falla (no skip-if-missing).
      - name: Prueba negativa runtime (capability denegada)
        run: |
          cargo test -p archmaker --locked \
            security_runtime_deny_ungranted_command \
            -- --nocapture

  frontend:
    name: Frontend pnpm check (G9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Exigir script "check" (CON-020)
        run: |
          if ! node -e "const s=require('./package.json').scripts||{};process.exit(s.check?0:1)"; then
            echo "::error::package.json falta scripts.check (CON-020: script ausente = fallar)"
            exit 1
          fi
      - name: pnpm install + check
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check

  web-wasm-prod:
    name: Web production build + WASM (OP-1/OP-7)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain pinned
        run: rustup show active-toolchain
      - name: Install wasm-bindgen-cli (match Cargo.lock)
        run: cargo install wasm-bindgen-cli --locked --version 0.2.129
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Build WASM + Vite production
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          cd apps/web
          pnpm build
      - name: E2E WASM (sin mock)
        run: |
          cd apps/web
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test wasm-flow.playwright.test.ts

  docs-python:
    name: Validadores Python + canonicalización (G0/G4/G5/G7/G9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: front matter + trazabilidad (no-strict) + gates + refs + canonicalize
        run: |
          # Dependencias fijadas (supply-chain, mismos pins que docs-validate.yml).
          python3 -m pip install --no-input --disable-pip-version-check pyyaml==6.0.2 "jsonschema==4.23.0"
          python3 tools/validate_front_matter.py
          python3 tools/validate_traceability.py
          python3 tools/gates.py
          python3 tools/validate_schema_refs.py
          python3 tools/canonicalize.py
          # CON-021/D-09 (I9): espejo Python del test Rust de capabilities
          # negativas; solo stdlib (tomllib), sin dependencias extra.
          python3 tools/check_negative_capabilities.py
          # P1 product-naming: Forge/ArchMaker + identidad técnica (T-NAME/T-MIG).
          python3 tools/check_product_naming.py
          # MVP-1: corpus de migración v5.1 → vNext (VAL-MIG / FR-IMPORT-001).
          python3 tools/validate_mig.py
          # G6-C03 / AUD-021: contraste y tokens WCAG 2.2 (1.4.1 = contract + manual).
          python3 tools/wcag_validate.py
          python3 tools/validate_closure_evidence.py
          # F7: inventario de matriz candidata; result=pending (sin aceptación firmada).
          python3 tools/run_f7_candidate_matrix.py --validate-only
          # F7: tests simulados del runner (strict/partial/cero tests/WASM incompleto).
          python3 tools/test_run_f7_candidate_matrix.py
          # P2: 20 adversarios de evidencia + control positivo / manifiestos antiguos.
          python3 tools/test_evidence_adversarial.py
          # P2: cierre de producto solo lectura (nunca autoaprueba).
          python3 tools/check_product_closure.py
          python3 tools/test_check_product_closure.py
          # P6: desktop/offline blocked explícito (sin mock ni AppImage histórico).
          python3 tools/check_desktop_offline_gate.py
          python3 tools/test_check_desktop_offline_gate.py
          # P3: harness P95 de producto (unitario; n=30 web no corre en CI).
          python3 tools/test_run_product_p95_harness.py
          # P4: pipeline Archify (negativos AS_BUILT/--check/codeRefs).
          python3 tools/test_run_archify_diagrams.py

  traceability:
    name: Matriz de trazabilidad FR/NFR -> TST/VAL (G2/G9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Instalar dependencias
        run: |
          python3 -m pip install --no-input --disable-pip-version-check pyyaml==6.0.2 "jsonschema==4.23.0" toml==0.10.2
      - name: Generar y validar matriz de trazabilidad
        run: |
          python3 tools/gen_test_inventory.py
          python3 tools/traceability_matrix.py
      - name: Subir matriz como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: traceability-matrix
          path: |
            docs/10-delivery/traceability-matrix.json
            docs/10-delivery/traceability-matrix.md
          retention-days: 30

  a11y-automated:
    name: Accesibilidad automatizada WCAG 2.2 AA (G6/G9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Instalar dependencias web
        run: |
          corepack enable
          cd apps/web
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Ejecutar checks a11y estáticos
        run: |
          cd apps/web
          python3 a11y-check.py
      - name: Ejecutar axe-core con Playwright
        run: |
          cd apps/web
          pnpm test-a11y:axe
      - name: Flujo MockCorePort (MVP-4)
        run: |
          cd apps/web
          pnpm test-a11y:flow
      - name: Subir informe axe como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-axe-report
          path: apps/web/a11y-axe-report/
          retention-days: 30

  visual-regression:
    name: Regresión visual baseline (G6/G9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Fuentes métricamente estables (Liberation Sans)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
      - name: Instalar dependencias web
        run: |
          corepack enable
          cd apps/web
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Ejecutar regresión visual
        run: |
          cd apps/web
          pnpm test-a11y:visual
      - name: Subir diffs visuales como artefacto
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-regression-diffs
          path: apps/web/visual-diffs/
          if-no-files-found: ignore
          retention-days: 30

  markdownlint:
    name: Markdown lint (G9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: |
            docs/**/*.md
            *.md
        # Config del gate: .markdownlint-cli2.jsonc (auto-descubierta).

  audit:
    name: Security audit Rust/JS (G9)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: cargo-audit si disponible
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            echo "cargo-audit ausente; instalando versión latest con --locked (crates.io)..."
            cargo install cargo-audit --locked
          fi
          cargo audit
      - name: pnpm/npm audit si hay lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm audit --audit-level high
          else
            echo "SKIP: sin pnpm-lock.yaml no hay auditoría JS ejecutable (gap I10-GAP-03)."
          fi
