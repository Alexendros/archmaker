# release — Supply chain + SBOM + firmas + AppImage Forge (F9 / DEC-011).
#
# Entradas: docs/10-delivery/packaging-release.md,
#           docs/10-delivery/closure/f9-release.md,
#           docs/08-security/supply-chain-policy.md, ADR-0008, ADR-0009, ADR-0010,
#           DEC-006 (Sigstore keyless + verificación offline),
#           DEC-007 (updater Tauri en MVP, canal firmado),
#           DEC-011 (AppImage Linux x86_64, nombre visible Forge).
# Pipeline: checkout RC → frontend + AppImage → SBOM → sign (cosign keyless) →
#           verify offline (trusted_root.json) → provenance SLSA v1 → publish.
# El tag v* no publica: publish solo con workflow_dispatch y publish_package.
#
# Política supply-chain (docs/09-quality/ci-cd.md):
#   - Solo acciones con SHA ya verificado (checkout, setup-python, setup-node).
#   - permissions: contents: read por defecto; id-token/contents write solo donde hace falta.
#   - Promoción sin rebuild: mismos digests entre canales.
#   - Plataforma autorizada: AppImage Linux x86_64 (Forge). Sin .deb/.rpm/AUR.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_package:
        description: Publica el AppImage solo si ya está validado con tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hold:
    name: Paquete en espera del AppImage validado
    if: github.event_name != 'workflow_dispatch' || (inputs.publish_package != true && inputs.publish_package != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No publicar la release de paquete
        run: |
          echo "El tag de versión no publica la GitHub Release."
          echo "El AppImage espera estar totalmente funcional y validado con tests."
          echo "Para publicar: workflow_dispatch con publish_package=true sobre ese tag."

  package:
    name: AppImage + checksums + SBOM (F9)
    if: github.event_name == 'workflow_dispatch' && (inputs.publish_package == true || inputs.publish_package == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain pinned (rust-toolchain.toml)
        run: rustup show active-toolchain && rustc --version && cargo --version
      - name: System deps (webkit / AppImage)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            wget fuse libfuse2
      - name: Setup Node (pnpm via corepack)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate && pnpm --version
      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile
      - name: wasm-bindgen-cli 0.2.129
        run: cargo install wasm-bindgen-cli --locked --version 0.2.129
      - name: Build web frontend (+ WASM)
        run: pnpm --dir apps/web build
      - name: Build AppImage (Forge)
        run: pnpm tauri build --bundles appimage
      - name: Collect artifacts + SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist
          APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | sort | head -1)
          test -n "$APPIMAGE"
          test -f target/release/archmaker
          cp -a "$APPIMAGE" dist/
          cp -a target/release/archmaker dist/archmaker
          (cd dist && sha256sum "$(basename "$APPIMAGE")" archmaker > SHA256SUMS)
          cat dist/SHA256SUMS
          # Metainfo pública: sin signo ARCH
          base="$(basename "$APPIMAGE")"
          case "$base" in
            Forge_*.AppImage) ;;
            *)
              echo "::error::AppImage must be Forge_*.AppImage (ADR-0012); got $base"
              exit 1
              ;;
          esac
          case "$base" in
            [Aa][Rr][Cc][Hh]*)
              echo "::error::Public artifact must not begin with ARCH"
              exit 1
              ;;
          esac
      - name: SBOM CycloneDX desde Cargo.lock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lock = Path("Cargo.lock").read_text(encoding="utf-8")
          pkgs = []
          for m in re.finditer(
              r'\[\[package\]\]\nname = "([^"]+)"\nversion = "([^"]+)"(?:\nsource = "([^"]+)")?',
              lock,
          ):
              name, version, source = m.groups()
              pkgs.append({
                  "type": "library",
                  "bom-ref": f"{name}@{version}",
                  "name": name,
                  "version": version,
                  "scope": "required" if source else "optional",
                  "externalReferences": (
                      [{"type": "distribution", "url": source}] if source else []
                  ),
              })
          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "application",
                      "name": "Forge",
                      "version": "0.1.0",
                  },
                  "tools": [{"name": "manual-fallback", "version": "cargo-lock-reader"}],
                  "comment": "SBOM CycloneDX mínimo desde Cargo.lock (F9).",
              },
              "components": sorted(pkgs, key=lambda c: c["bom-ref"]),
          }
          Path("dist/sbom.cdx.json").write_text(json.dumps(bom, indent=2) + "\n", encoding="utf-8")
          print(f"SBOM: {len(pkgs)} componentes")
          PY
          python3 -m json.tool dist/sbom.cdx.json > /dev/null
      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  sign-verify:
    name: Firma Sigstore + verificación offline (T-I11-02)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: package
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download dist
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-dist
          path: dist
      - name: Instalar cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION=v2.4.3
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          cosign version
      - name: Materializar trusted_root.json si es placeholder
        run: |
          set -euo pipefail
          if grep -q '"_placeholder": *true' trusted_root.json; then
            echo "Materializando trusted_root.json desde Sigstore..."
            cosign trusted-root create --dst trusted_root.json
            cat > trusted_root.json.meta << META
          {
            "source": "https://tuf-repo-cdn.sigstore.dev",
            "captured_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tool": "cosign trusted-root create"
          }
          META
          fi
      - name: Firmar AppImage + SBOM + SHA256SUMS (keyless)
        run: |
          set -euo pipefail
          APPIMAGE=$(find dist -maxdepth 1 -type f -name '*.AppImage' | sort | head -1)
          test -n "$APPIMAGE"
          cosign sign-blob --yes "$APPIMAGE" \
            --output-signature "${APPIMAGE}.sig" --output-certificate "${APPIMAGE}.pem"
          cosign sign-blob --yes dist/sbom.cdx.json \
            --output-signature dist/sbom.cdx.json.sig --output-certificate dist/sbom.cdx.json.pem
          cosign sign-blob --yes dist/SHA256SUMS \
            --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem
      - name: Verificar offline con trusted_root.json
        run: |
          set -euo pipefail
          if grep -q '"_placeholder": *true' trusted_root.json; then
            echo "::warning::trusted_root.json sigue siendo placeholder (CON-015); verificación offline diferida (DEC-006). La firma keyless se publica y el verificador puede comprobarla con raíces reales."
            exit 0
          fi
          IDENTITY="^https://github.com/${GITHUB_REPOSITORY}/"
          ISSUER="https://token.actions.githubusercontent.com"
          APPIMAGE=$(find dist -maxdepth 1 -type f -name '*.AppImage' | sort | head -1)
          cosign verify-blob --trusted-root trusted_root.json \
            --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            --certificate "${APPIMAGE}.pem" --signature "${APPIMAGE}.sig" "$APPIMAGE"
          cosign verify-blob --trusted-root trusted_root.json \
            --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            --certificate dist/sbom.cdx.json.pem --signature dist/sbom.cdx.json.sig \
            dist/sbom.cdx.json
          cosign verify-blob --trusted-root trusted_root.json \
            --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            --certificate dist/SHA256SUMS.pem --signature dist/SHA256SUMS.sig \
            dist/SHA256SUMS
          echo "Verificación offline OK."
      - name: Upload signed dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist-signed
          path: |
            dist/
            trusted_root.json
            trusted_root.json.meta
          if-no-files-found: error
          retention-days: 14

  provenance-publish:
    name: Provenance SLSA v1 + publish (T-I11-03)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: sign-verify
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download signed dist
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-dist-signed
          path: .
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Generar provenance SLSA v1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          materials = []
          for pattern in ["dist/*.AppImage", "dist/sbom.cdx.json", "dist/SHA256SUMS"]:
              for f in sorted(Path().glob(pattern)):
                  materials.append({
                      "uri": f"git+https://github.com/{os.environ.get('GITHUB_REPOSITORY', 'unknown')}@{os.environ.get('GITHUB_SHA', 'unknown')}#{f}",
                      "digest": {"sha256": sha256(f)},
                  })

          prov = {
              "_type": "https://in-toto.io/Statement/v1",
              "subject": [
                  {"name": Path(m["uri"].split("#", 1)[1]).name, "digest": m["digest"]}
                  for m in materials
              ],
              "predicateType": "https://slsa.dev/provenance/v1",
              "predicate": {
                  "buildDefinition": {
                      "buildType": "https://github.com/Alexendros/archmaker/release-workflow/v1",
                      "externalParameters": {
                          "workflow": {
                              "ref": os.environ.get("GITHUB_REF", ""),
                              "sha": os.environ.get("GITHUB_SHA", ""),
                              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
                          },
                          "platform": "AppImage Linux x86_64",
                          "public_name": "Forge",
                      },
                      "resolvedDependencies": materials,
                  },
                  "runDetails": {
                      "builder": {"id": "https://github.com/Alexendros/archmaker/release-workflow/v1"},
                      "metadata": {
                          "invocationId": f"{os.environ.get('GITHUB_RUN_ID', '')}/{os.environ.get('GITHUB_RUN_ATTEMPT', '')}",
                      },
                      "byproducts": [],
                  },
              },
          }
          Path("dist/slsa-provenance.json").write_text(json.dumps(prov, indent=2) + "\n", encoding="utf-8")
          print(f"Provenance SLSA v1: {len(materials)} materiales.")
          PY
      - name: Publicar artefactos en el release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "Forge $TAG" \
            --notes "AppImage Linux x86_64 (Forge). Canal F8/F9 (DEC-011). Verificar SHA256SUMS. Cosign keyless + SLSA provenance adjuntos. Sin .deb/.rpm/AUR." \
            dist/*.AppImage \
            dist/*.AppImage.sig \
            dist/*.AppImage.pem \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig \
            dist/SHA256SUMS.pem \
            dist/sbom.cdx.json \
            dist/sbom.cdx.json.sig \
            dist/sbom.cdx.json.pem \
            dist/slsa-provenance.json \
            dist/archmaker \
            || gh release upload "$TAG" \
              dist/*.AppImage \
              dist/*.AppImage.sig \
              dist/*.AppImage.pem \
              dist/SHA256SUMS \
              dist/SHA256SUMS.sig \
              dist/SHA256SUMS.pem \
              dist/sbom.cdx.json \
              dist/sbom.cdx.json.sig \
              dist/sbom.cdx.json.pem \
              dist/slsa-provenance.json \
              dist/archmaker \
              --clobber

  a11y-gate:
    name: Release gate — Accesibilidad WCAG 2.2 AA (G6/G10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verificar que no hay defectos critical/serious abiertos en matriz WCAG
        run: |
          set -euo pipefail
          if grep -q 'severity.*critical\|severity.*serious' docs/05-ux/accessibility-matrix.md 2>/dev/null; then
            echo "FALLA: Defectos critical/serious detectados en matriz WCAG."
            exit 1
          fi
          echo "OK: sin defectos critical/serious en matriz WCAG 2.2 AA."
