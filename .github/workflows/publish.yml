# publish — Publicación de AppImage Forge con firmas, SBOM y provenance (F9 / DEC-011).
#
# Entradas: docs/10-delivery/packaging-release.md,
#           docs/10-delivery/closure/f9-release.md,
#           docs/08-security/supply-chain-policy.md, ADR-0008, ADR-0009, ADR-0010,
#           DEC-006 (Sigstore keyless + firmas verificables),
#           DEC-007 (updater Tauri en MVP, canal firmado),
#           DEC-011 (AppImage Linux x86_64, nombre visible Forge).
# Pipeline: checkout tag → frontend + AppImage → SBOM → sign (cosign keyless) →
#           verify (identidad + issuer) → provenance (actions/attest-build-provenance)
#           → upload al borrador del release → verify-release.
#
# Disparadores:
#   - push de tag v* (release-please crea el borrador).
#   - workflow_call con input tag (provisional, D-E4, hasta migrar a la App CI).
#
# Política supply-chain:
#   - Solo acciones con SHA verificado.
#   - permissions: contents: read por defecto; id-token/attestations/contents write
#     solo donde hace falta.
#   - Promoción sin rebuild: mismos digests entre canales.
#   - Plataforma autorizada: AppImage Linux x86_64 (Forge). Sin .deb/.rpm/AUR.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag a publicar
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Metadatos del release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Calcular tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_call" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::Tag inválido: $tag"
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: AppImage + checksums + SBOM (F9)
    needs: [metadata]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain pinned (rust-toolchain.toml)
        run: rustup show active-toolchain && rustc --version && cargo --version

      - name: System deps (webkit / AppImage)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            wget fuse libfuse2

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.34.8 --activate && pnpm --version

      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: wasm-bindgen-cli 0.2.129
        run: cargo install wasm-bindgen-cli --locked --version 0.2.129

      - name: Build web frontend (+ WASM)
        run: pnpm --dir apps/web build

      - name: Build AppImage (Forge)
        run: pnpm tauri build --bundles appimage

      - name: Collect artifacts + SHA256SUMS
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | sort | head -1)
          test -n "$APPIMAGE"
          test -f target/release/archmaker
          cp -a "$APPIMAGE" dist/
          cp -a target/release/archmaker dist/archmaker
          (cd dist && sha256sum "$(basename "$APPIMAGE")" archmaker > SHA256SUMS)
          cat dist/SHA256SUMS
          base="$(basename "$APPIMAGE")"
          case "$base" in
            Forge_*.AppImage) ;;
            *)
              echo "::error::AppImage must be Forge_*.AppImage (ADR-0012); got $base"
              exit 1
              ;;
          esac
          case "$base" in
            [Aa][Rr][Cc][Hh]*)
              echo "::error::Public artifact must not begin with ARCH"
              exit 1
              ;;
          esac

      - name: SBOM CycloneDX desde Cargo.lock
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ.get("TAG", "0.0.0")
          lock = Path("Cargo.lock").read_text(encoding="utf-8")
          pkgs = []
          for m in re.finditer(
              r'\[\[package\]\]\nname = "([^"]+)"\nversion = "([^"]+)"(?:\nsource = "([^"]+)")?',
              lock,
          ):
              name, version, source = m.groups()
              pkgs.append({
                  "type": "library",
                  "bom-ref": f"{name}@{version}",
                  "name": name,
                  "version": version,
                  "scope": "required" if source else "optional",
                  "externalReferences": (
                      [{"type": "distribution", "url": source}] if source else []
                  ),
              })
          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "application",
                      "name": "Forge",
                      "version": tag,
                  },
                  "tools": [{"name": "manual-fallback", "version": "cargo-lock-reader"}],
                  "comment": "SBOM CycloneDX mínimo desde Cargo.lock (F9).",
              },
              "components": sorted(pkgs, key=lambda c: c["bom-ref"]),
          }
          Path("dist/sbom.cdx.json").write_text(json.dumps(bom, indent=2) + "\n", encoding="utf-8")
          print(f"SBOM: {len(pkgs)} componentes")
          PY
          python3 -m json.tool dist/sbom.cdx.json > /dev/null

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  a11y-gate:
    name: Release gate — Accesibilidad WCAG 2.2 AA (G6/G10)
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verificar que no hay defectos critical/serious abiertos en matriz WCAG
        run: |
          set -euo pipefail
          if grep -q 'severity.*critical\|severity.*serious' docs/05-ux/accessibility-matrix.md 2>/dev/null; then
            echo "FALLA: Defectos critical/serious detectados en matriz WCAG."
            exit 1
          fi
          echo "OK: sin defectos critical/serious en matriz WCAG 2.2 AA."

  sign-verify:
    name: Firma Sigstore + verificación de firmas (T-I11-02)
    needs: [package]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dist
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-dist
          path: dist

      - name: Instalar cosign
        run: |
          set -euo pipefail
          COSIGN_VERSION=v2.4.3
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/cosign" | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          cosign version

      - name: Materializar trusted_root.json si es placeholder
        run: |
          set -euo pipefail
          if grep -q '"_placeholder": *true' trusted_root.json; then
            echo "Materializando trusted_root.json desde Sigstore..."
            cosign trusted-root create --dst trusted_root.json
            cat > trusted_root.json.meta << META
          {
            "source": "https://tuf-repo-cdn.sigstore.dev",
            "captured_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tool": "cosign trusted-root create"
          }
          META
          fi

      - name: Firmar AppImage + SBOM + SHA256SUMS (keyless)
        run: |
          set -euo pipefail
          APPIMAGE=$(find dist -maxdepth 1 -type f -name '*.AppImage' | sort | head -1)
          test -n "$APPIMAGE"
          cosign sign-blob --yes "$APPIMAGE" \
            --output-signature "${APPIMAGE}.sig" --output-certificate "${APPIMAGE}.pem"
          cosign sign-blob --yes dist/sbom.cdx.json \
            --output-signature dist/sbom.cdx.json.sig --output-certificate dist/sbom.cdx.json.pem
          cosign sign-blob --yes dist/SHA256SUMS \
            --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem

      - name: Verificar firmas Sigstore (identidad + issuer)
        run: |
          set -euo pipefail
          if grep -q '"_placeholder": *true' trusted_root.json; then
            echo "::warning::trusted_root.json sigue siendo placeholder (CON-015); sin raíz materializada la verificación se hace contra la instancia pública. Verificación estrictamente offline diferida (DEC-006): requiere firmas en formato bundle (--new-bundle-format)."
          fi
          IDENTITY="^https://github.com/${GITHUB_REPOSITORY}/"
          ISSUER="https://token.actions.githubusercontent.com"
          APPIMAGE=$(find dist -maxdepth 1 -type f -name '*.AppImage' | sort | head -1)
          cosign verify-blob \
            --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            --certificate "${APPIMAGE}.pem" --signature "${APPIMAGE}.sig" "$APPIMAGE"
          cosign verify-blob \
            --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            --certificate dist/sbom.cdx.json.pem --signature dist/sbom.cdx.json.sig \
            dist/sbom.cdx.json
          cosign verify-blob \
            --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" \
            --certificate dist/SHA256SUMS.pem --signature dist/SHA256SUMS.sig \
            dist/SHA256SUMS
          echo "Verificación de firmas OK."

      - name: Upload signed dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist-signed
          path: |
            dist/
            trusted_root.json
            trusted_root.json.meta
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Provenance con actions/attest-build-provenance
    needs: [sign-verify]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download signed dist
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-dist-signed
          path: dist

      - name: Attest AppImage
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.AppImage

      - name: Attest SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/sbom.cdx.json

      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS

      - name: Upload attested dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist-attested
          path: dist/
          if-no-files-found: error
          retention-days: 14

  upload:
    name: Subir artefactos al borrador del release
    needs: [metadata, attest, a11y-gate]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download attested dist
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-dist-attested
          path: dist

      - name: Subir al borrador del release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber

  verify-release:
    name: Verificar release publicado
    needs: [metadata, upload]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist

      - name: Verificar attestations y firmas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify dist/*.AppImage --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/sbom.cdx.json --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"

      - name: Listar assets del release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,assets,draft
