[package]
name = "archmaker-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
archmaker-domain = { path = "../archmaker-domain" }
archmaker-canonicalization = { path = "../archmaker-canonicalization" }
archmaker-rules = { path = "../archmaker-rules" }
archmaker-resolution = { path = "../archmaker-resolution" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Ya en el grafo (Cargo.lock). Solo familia wasm: Crypto.getRandomValues vía wasm_js.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
