[package]
name = "archmaker-hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Observación de host Linux (solo lectura) y planificación de almacenamiento portable"

[features]
default = []
# IO de host Linux (sysfs/lsblk). No activar en WASM ni en archmaker-core.
probe = []

[dependencies]
archmaker-domain = { path = "../archmaker-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
